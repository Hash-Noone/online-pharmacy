<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - PharmaHub</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav>
            <h1>PharmaHub</h1>

            <div>
                <a href="index.html">Home</a>
                <a href="medicines.html">Medicines</a>
                <a href="login.html">Login</a>
                <a href="cart.html">Cart 🛒</a>
            </div>
        </nav>
    </header>

    <main>
        <section>

            <h2>Your Cart</h2>

            <div id="cart-items">
                <!-- JavaScript will put cart items here -->
            </div>

            <div id="delivery-address-section" class="delivery-address-group hidden">
                <label for="delivery-address">Delivery Address</label>
                <textarea id="delivery-address" placeholder="Enter the address where your order should be delivered" required></textarea>
            </div>

            <div id="cart-summary" class="cart-summary hidden">
                <div class="cart-summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal"></span>
                </div>
                <div class="cart-summary-row">
                    <span id="summary-tax-label">Tax</span>
                    <span id="summary-tax"></span>
                </div>
                <div class="cart-summary-row">
                    <span>Delivery Fee</span>
                    <span id="summary-delivery"></span>
                </div>
                <div class="cart-summary-row total">
                    <span>Total</span>
                    <span id="summary-grand-total"></span>
                </div>
            </div>

            <button id="checkout-button">
                Checkout
            </button>

        </section>
    </main>
    <script src="js/nav.js"></script>
    <script src="js/cart.js"></script>

</body>
</html>
