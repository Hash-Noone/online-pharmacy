services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmahub
      POSTGRES_PASSWORD: pharmahub
      POSTGRES_DB: pharmahub
    ports:
      - "5432:5432"
    volumes:
      - pharmahub_pgdata:/var/lib/postgresql/data

volumes:
  pharmahub_pgdata:
